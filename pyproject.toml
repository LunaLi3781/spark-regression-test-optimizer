[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "spark-regression-test-optimizer"
version = "0.1.0"
description = "Reproducible cost-aware regression test selection baselines"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
dependencies = []

[project.scripts]
spark-rto = "spark_rto.__main__:main"

[tool.setuptools.packages.find]
include = ["spark_rto*"]
