name: Shared-history comparison
on: workflow_dispatch
permissions:
  contents: read
jobs:
  comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python -m pip install pyspark==4.0.0
      - run: python -m unittest discover -s tests -v
      - run: python -m scripts.compare_strategies --output-dir results/comparison
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-history-comparison
          path: results/comparison/
