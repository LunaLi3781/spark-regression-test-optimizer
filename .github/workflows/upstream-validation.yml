name: Apache Spark upstream patch validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SPARK_LOCAL_IP: 127.0.0.1
      PYSPARK_PYTHON: python3
    steps:
      - uses: actions/checkout@v4
        with:
          repository: LunaLi3781/spark
          ref: 4075e4b7a914cf67e5f35ee039c37df9c12cfaec
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: sbt
      - name: Install SQL test dependencies
        run: python -m pip install --upgrade pip && python -m pip install --group sql ruff==0.14.8
      - name: Check changed Python files
        run: |
          ruff check --config pyproject.toml python/pyspark/testing/utils.py python/pyspark/sql/tests/test_utils.py
          ruff format --check --config pyproject.toml python/pyspark/testing/utils.py python/pyspark/sql/tests/test_utils.py
      - name: Build Spark with Hive
        run: build/sbt -J-Xmx4g -Phive package > /tmp/spark-source-build.log 2>&1
      - name: Run native PySpark utility tests
        run: python/run-tests --python-executable python3 --testnames pyspark.sql.tests.test_utils
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-source-validation
          path: |
            /tmp/spark-source-build.log
            python/unit-tests.log
