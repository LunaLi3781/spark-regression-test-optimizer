name: Spark upgrade compatibility
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        spark: ['3.5.3', '4.0.0', '4.0.1']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python -m pip install . pyspark==${{ matrix.spark }}
      - run: |
          spark-compat collect --output results/${{ matrix.spark }}-defaults.json
          spark-compat collect --profile ansi-off --output results/${{ matrix.spark }}-ansi-off.json
        env:
          SPARK_LOCAL_IP: 127.0.0.1
      - name: Collect historical defect probes
        if: matrix.spark != '3.5.3'
        run: spark-compat collect --suite historical --output results/${{ matrix.spark }}-historical.json
        env:
          SPARK_LOCAL_IP: 127.0.0.1
      - uses: actions/upload-artifact@v4
        if: matrix.spark != '3.5.3'
        with:
          name: compat-historical-${{ matrix.spark }}
          path: results/*-historical.json
      - uses: actions/upload-artifact@v4
        with:
          name: compat-${{ matrix.spark }}
          path: results/*-defaults.json
      - uses: actions/upload-artifact@v4
        with:
          name: compat-controlled-${{ matrix.spark }}
          path: results/*-ansi-off.json
  compare:
    needs: collect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: compat-*
          merge-multiple: true
          path: results
      - run: |
          python -m spark_compat compare results/3.5.3-defaults.json results/4.0.1-defaults.json --output results/diff-defaults.json --markdown results/defaults.md
          python -m spark_compat compare results/3.5.3-ansi-off.json results/4.0.1-ansi-off.json --output results/diff-ansi-off.json --markdown results/ansi-off.md
          python -m spark_compat compare results/4.0.0-historical.json results/4.0.1-historical.json --output results/diff-historical.json --markdown results/historical.md
      - name: Verify historical defect expectations independently of differences
        run: |
          python - <<'PYTEST'
          import json
          for version in ['4.0.0', '4.0.1']:
              data = json.load(open('results/' + version + '-historical.json'))
              assert data['spark_version'] == version
              cases = {c['id']: c for c in data['cases']}
              assert cases['xml_string_control']['oracle_result'] == 'pass'
              binary = cases['xml_binary_52788']
              if version == '4.0.0':
                  assert binary['error'] == 'SPARK-52788_BINARY_XML_CONVERSION'
                  assert binary['oracle_result'] == 'fail'
              else:
                  assert binary['status'] == 'ok' and binary['oracle_result'] == 'pass'
          PYTEST
      - uses: actions/upload-artifact@v4
        with:
          name: compatibility-report
          path: results/
