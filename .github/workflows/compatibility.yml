name: Spark upgrade compatibility
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        spark: ['3.5.3', '4.0.1']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python -m pip install . pyspark==${{ matrix.spark }}
      - run: |
          spark-compat collect --output results/${{ matrix.spark }}-defaults.json
          spark-compat collect --profile ansi-off --output results/${{ matrix.spark }}-ansi-off.json
        env:
          SPARK_LOCAL_IP: 127.0.0.1
      - uses: actions/upload-artifact@v4
        with:
          name: compat-${{ matrix.spark }}
          path: results/*-defaults.json
      - uses: actions/upload-artifact@v4
        with:
          name: compat-controlled-${{ matrix.spark }}
          path: results/*-ansi-off.json
  compare:
    needs: collect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: compat-*
          merge-multiple: true
          path: results
      - run: |
          python -m spark_compat compare results/3.5.3-defaults.json results/4.0.1-defaults.json --output results/diff-defaults.json
          python -m spark_compat compare results/3.5.3-ansi-off.json results/4.0.1-ansi-off.json --output results/diff-ansi-off.json
      - uses: actions/upload-artifact@v4
        with:
          name: compatibility-report
          path: results/
